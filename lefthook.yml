pre-commit:
  parallel: true
  commands:
    staged-lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: pnpm exec oxlint --deny-warnings {staged_files}
    staged-format:
      glob: '*.{ts,tsx,js,mjs,json,css,md,yaml,yml}'
      run: pnpm exec oxfmt --check {staged_files}
    diff-check:
      run: git --no-pager diff --cached --check
pre-push:
  commands:
    harness:
      run: pnpm check
